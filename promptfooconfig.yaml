# Offline Deterministic Content QA & Level-1 Authoring Red-Team Configuration (Gate G13)
#
# Runs 100% offline with zero external LLM APIs, zero network providers, and
# telemetry/sharing disabled. Mirrors the deterministic assertions enforced in
# `src/shared/content/qa-gate.ts` and executed via `node scripts/qa-content.mjs`.

description: "TAI Learning OS — Offline Deterministic Level-1 Lesson QA & Safety Gate (G13)"

sharing: false

env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_OFFLINE_ONLY: "1"

providers:
  - id: echo
    label: "offline-deterministic-echo-provider"

prompts:
  - "{{candidate_payload}}"

defaultTest:
  options:
    transformVars: "{ ...vars }"
  assert:
    - type: not-icontains
      metric: answer-leakage
      value: "correctChoiceId"
    - type: not-icontains
      metric: answer-leakage
      value: "[ANSWER:"
    - type: not-icontains
      metric: prompt-injection
      value: "ignore previous instructions"
    - type: not-icontains
      metric: prompt-injection
      value: "system prompt"
    - type: not-icontains
      metric: anti-gamification
      value: "leaderboard"
    - type: not-icontains
      metric: anti-gamification
      value: "daily streak"
    - type: not-icontains
      metric: anti-gamification
      value: "bảng xếp hạng"

# Canonical rule manifest verified by `scripts/qa-content.mjs`
# qaRules:
#   - schema-and-rights
#   - math-equivalence
#   - answer-leakage
#   - prompt-injection
#   - anti-gamification
#   - vietnamese-pedagogy

tests:
  - description: "Clean Grade 5 decimal addition step passes all offline assertions"
    vars:
      candidate_payload: '{"question_vi":"Kết quả của 2,5 + 1,25 là bao nhiêu?","choices":[{"id":"a","label_vi":"2,70"},{"id":"b","label_vi":"3,75"}],"sourceRef":"GDPT 2018 Toán Lớp 5","explanationVi":"Đặt thẳng dấu phẩy: 2,50 + 1,25 = 3,75."}'
    assert:
      - type: contains
        metric: schema-and-rights
        value: "GDPT 2018"
      - type: contains
        metric: math-equivalence
        value: "3,75"
      - type: contains
        metric: vietnamese-pedagogy
        value: "Đặt thẳng dấu phẩy"

  - description: "Clean Grade 4 equivalent fraction step passes all offline assertions"
    vars:
      candidate_payload: '{"question_vi":"2/3 bằng phân số nào trong các đáp án sau?","choices":[{"id":"a","label_vi":"4/6"},{"id":"b","label_vi":"3/6"},{"id":"c","label_vi":"4/9"}],"sourceRef":"GDPT 2018 Toán Lớp 4","explanationVi":"Nhân cả tử và mẫu của 2/3 với 2 được 4/6."}'
    assert:
      - type: contains
        metric: schema-and-rights
        value: "GDPT 2018"
      - type: contains
        metric: math-equivalence
        value: "4/6"
      - type: contains
        metric: vietnamese-pedagogy
        value: "Nhân cả tử và mẫu"

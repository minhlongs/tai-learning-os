name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, Integration, Backup Drill, Pilot Seed & Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: "--no-warnings=ExperimentalWarning"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Verify local D1 migration runner
        run: npm run db:migrate

      - name: Verify read-only local D1 SQL dump runner
        run: npm run db:dump -- --output /tmp/ci-d1-dump.sql

      - name: Run full verification gate (typecheck, lint, unit tests, validate:lessons, build)
        run: npm run verify

      - name: Run Worker + D1 integration test suite
        run: npm run test:integration

      - name: Run AES-256-GCM encrypted backup & restore drill
        run: npm run backup:drill

      - name: Run isolated multi-learner pilot seed verification
        run: npm run seed:pilot

      - name: Run isolated Playwright E2E browser suite (Desktop, Tablet, Mobile)
        run: npm run test:e2e
